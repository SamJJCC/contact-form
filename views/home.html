<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="icon" href="images/form-image.png">
    <link rel="stylesheet" href="styles/style.css">
    <script src="js/contact.js" defer></script>
</head>

<body>
    <div id="main">

        <div id="header">
            <h1>Contact Form</h1>
        </div>

        <form id="contact-form" action="#" method="get">
            <div class="form-columns">

                <div class="field">
                 <label for="fname">First Name</label>
                    <input type="text" id="fname" name="fname">
                </div>

                <div class="field">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lname">
                </div>

                <div class="field">
                    <label for="job-title">Job Title</label>
                    <input type="text" id="job-title" name="job-title">
                </div>

            </div>

            <div class="form-columns">

                <div class="field">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company">
                </div>

                <div class="field">
                    <label for="LinkedIn">LinkedIn URL</label>
                    <input type="text" id="LinkedIn" name="LinkedIn">
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email">
                </div>

            </div>

          
            <div class="column-details">

                <div class="field">
                    <label for="HDWM">How did we meet?</label>
                    <select id="HDWM" name="HDWM">
                        <option value="none">Please select an option</option>
                        <option value="netwk">Networking Event</option>
                        <option value="careerF">Career Fair</option>
                        <option value="LinkedIn">LinkedIn</option>
                        
                    </select>
                </div>

                <div class="field">
                    <label for="other">Other (please specify)</label>
                    <input type="text" id="other" name="other">
                </div>

            </div>

          
            <div class="field">
                <label for="message">Message</label>
                <textarea rows="5" id="message" name="message"></textarea>
            </div>

          
            <label for="mail-list" class="checkbox-label">
                <input type="checkbox" id="mail-list"
                       name="mail-list" value="mail-list">
                Please add me to your mailing list
            </label>

            <div class="email-format">
                <label>Choose an email format:</label>

                <label for="html">
                    <input type="radio" id="html"
                           name="email-format" value="html" checked>
                    HTML
                </label>

                <label for="text">
                    <input type="radio" id="text"
                           name="email-format" value="text">
                    Text
                </label>
            </div>

           
            <button type="submit" id="submit-btn">Submit</button>

        </form>
    </div>
</body>
</html>
